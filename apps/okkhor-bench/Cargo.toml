[package]
name = "okkhor-bench"
description = "Repeatable non-hook benchmark harness for the Okkhor 0.2 input layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
okkhor-core.workspace = true
okkhor-engine.workspace = true
okkhor-lang.workspace = true
okkhor-learn.workspace = true
okkhor-transliterate.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
okkhor-win.workspace = true
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
