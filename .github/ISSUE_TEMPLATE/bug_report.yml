name: Bug report
description: Report a correctness, compatibility, or performance problem.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real typed text, passwords, or personal data. Use synthetic examples.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2, 26100.xxxx
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Use synthetic input only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - input / hook / injection
        - Bengali correctness / layout
        - suggestions / learning
        - UI
        - speech / AI
        - installer / update
        - performance
        - other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included real user text, credentials, or personal data.
          required: true
