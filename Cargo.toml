[workspace]
resolver = "2"
members = [
    "apps/okkhor-bench",
    "apps/okkhor-daemon",
    "crates/okkhor-compat",
    "crates/okkhor-core",
    "crates/okkhor-engine",
    "crates/okkhor-learn",
    "crates/okkhor-lang",
    "crates/okkhor-storage",
    "crates/okkhor-win",
    "crates/okkhor-transliterate",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
okkhor-core = { path = "crates/okkhor-core" }
okkhor-learn = { path = "crates/okkhor-learn" }
okkhor-storage = { path = "crates/okkhor-storage" }
okkhor-win = { path = "crates/okkhor-win" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
