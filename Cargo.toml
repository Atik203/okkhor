[workspace]
resolver = "2"
members = [
    "apps/akkhor-daemon",
    "crates/akkhor-core",
    "crates/akkhor-learn",
    "crates/akkhor-storage",
    "crates/akkhor-win",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
akkhor-core = { path = "crates/akkhor-core" }
akkhor-learn = { path = "crates/akkhor-learn" }
akkhor-storage = { path = "crates/akkhor-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
