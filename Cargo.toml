[workspace]
resolver = "2"
members = [
    "apps/okkhor-bench",
    "apps/okkhor-daemon",
    "apps/okkhor-worker",
    "crates/okkhor-ai",
    "crates/okkhor-compat",
    "crates/okkhor-core",
    "crates/okkhor-engine",
    "crates/okkhor-features",
    "crates/okkhor-ipc",
    "crates/okkhor-learn",
    "crates/okkhor-lang",
    "crates/okkhor-model",
    "crates/okkhor-storage",
    "crates/okkhor-win",
    "crates/okkhor-transliterate",
    "crates/okkhor-train",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
okkhor-core = { path = "crates/okkhor-core" }
okkhor-ai = { path = "crates/okkhor-ai" }
okkhor-engine = { path = "crates/okkhor-engine" }
okkhor-features = { path = "crates/okkhor-features" }
okkhor-ipc = { path = "crates/okkhor-ipc" }
okkhor-lang = { path = "crates/okkhor-lang" }
okkhor-learn = { path = "crates/okkhor-learn" }
okkhor-model = { path = "crates/okkhor-model" }
okkhor-storage = { path = "crates/okkhor-storage" }
okkhor-transliterate = { path = "crates/okkhor-transliterate" }
okkhor-win = { path = "crates/okkhor-win" }
fancy-regex = "0.20"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
# IPC transport only: named pipes, deadlines, shutdown sync (no full features).
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# OS CSPRNG for the 32-byte IPC session token (ADR 0012 §2).
getrandom = "0.3"
# Live AI provider transport, built only for the `http` feature (ADR 0018).
# Blocking JSON client over rustls; no default features, so no native TLS.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
