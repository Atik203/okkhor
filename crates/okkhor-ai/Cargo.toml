[package]
name = "okkhor-ai"
description = "Opt-in AI orchestration core for Okkhor: providers, bounded cache, breaker, single-flight, and policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Live OpenAI provider. Off by default so the default build and CI stay offline
# (ADR 0018 §3). Enables the `reqwest` blocking client and JSON encoding.
http = ["dep:reqwest", "dep:serde_json"]

[dependencies]
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
