[package]
name = "okkhor-train"
description = "Offline replay harness, feature schema v1, and synthetic replay dataset generator for Okkhor. Not shipped in the app; no network, no user data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "okkhor-replay"
path = "src/bin/okkhor-replay.rs"

[[bin]]
name = "okkhor-train-dataset"
path = "src/bin/okkhor-train-dataset.rs"

[[bin]]
name = "okkhor-train-fit"
path = "src/bin/okkhor-train-fit.rs"

[dependencies]
okkhor-core.workspace = true
okkhor-engine.workspace = true
okkhor-features.workspace = true
okkhor-lang.workspace = true
okkhor-learn.workspace = true
okkhor-model.workspace = true
okkhor-transliterate.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
