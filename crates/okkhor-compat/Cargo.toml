[package]
name = "okkhor-compat"
description = "Safe FFI boundary, DLL path validation, and per-adapter feature flags for legacy Okkhor adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []          # no adapter compiled in
word-trie = []
sentence-trie = []
translator = []
caret = []
emoji-manager = []

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
